# Кожен коміт і PR: збірка + перевірка синтаксису PowerShell + пакет (артефакт для завантаження).
# Тег vX.Y.Z: те саме + реліз на GitHub (інсталятор, portable zip, SHA256SUMS, нотатки з CHANGELOG.md).
# Реліз: оновити VERSION і CHANGELOG.md → коміт → git tag vX.Y.Z → git push --tags
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        # Windows PowerShell 5.1 — саме в ній працюють скрипти у користувачів.
        # Вбудовані кроки GitHub зберігає як UTF-8 без BOM, а 5.1 читає їх як ANSI: у run: лише ASCII,
        # український текст — у файлах .ps1 з BOM.
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Check PowerShell syntax
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content VERSION -TotalCount 1).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { Write-Host "::error::Tag $env:GITHUB_REF_NAME does not match VERSION ($version)"; exit 1 }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }

      - name: Build and package
        run: .\tools\Package.ps1 -RequireInstaller

      - uses: actions/upload-artifact@v5
        with:
          name: DEADPIXEL-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5   # gh визначає репозиторій за git remote
      - uses: actions/download-artifact@v5
        with:
          name: DEADPIXEL-${{ github.sha }}
          path: dist
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File -Include *.zip,*.exe,SHA256SUMS.txt -Recurse).FullName `
            --title "DEADPIXEL $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file dist\release-notes.md --verify-tag
